name: Build and verify desktop packages

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: macos-15-intel
            target: macos-x64
          - runner: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Install pnpm
        run: npm install --global pnpm@10.33.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependency advisories
        run: pnpm audit --audit-level=low
      - name: Build
        run: pnpm build
      - name: Install bundled browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run automated tests
        run: pnpm test
      - name: Package for this runner
        run: pnpm package "release/abralo-${{ matrix.target }}"
        env:
          ABRALO_VERSION: '0.2.0-preview'
      - name: Verify packaged runtime and contents
        run: node scripts/verify-package.mjs "release/abralo-${{ matrix.target }}"
      - name: Verify native providers in a clean profile without inference
        run: node scripts/provider-runtime-smoke.mjs "release/abralo-${{ matrix.target }}"
      - name: Verify onboarding failure and recovery in the packaged UI
        run: pnpm exec tsx scripts/onboarding-reliability-smoke.ts
        env:
          ABRALO_TEST_WEB_ROOT: release/abralo-${{ matrix.target }}/dist/web
      - name: Exercise isolated launcher, authentication, restart, and backup
        run: node scripts/preview-lifecycle-smoke.mjs "release/abralo-${{ matrix.target }}"
      - name: Install and remove in a disposable profile
        run: node scripts/installer-acceptance-smoke.mjs "release/abralo-${{ matrix.target }}"
      - name: Archive on the native runner to preserve executable permissions
        shell: bash
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/abralo-${{ matrix.target }}.tar.gz" -C "release/abralo-${{ matrix.target }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: abralo-${{ matrix.target }}-${{ github.sha }}
          path: release-assets/abralo-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: abralo-*-${{ github.sha }}
          path: release-packages
      - name: Create release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          count=0
          for package in release-packages/abralo-*-"${GITHUB_SHA}"/*.tar.gz; do
            [[ -f "$package" ]] || continue
            cp "$package" release-assets/
            count=$((count + 1))
          done
          [[ "$count" -eq 4 ]] || { echo "Expected four platform packages, found $count" >&2; exit 1; }
          find release-assets -type f -name '*.tar.gz' -size +2047M -print -quit | grep -q . && {
            echo "A release asset exceeds GitHub's 2 GiB per-file limit." >&2
            exit 1
          } || true
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "Abralo $GITHUB_REF_NAME" --draft --prerelease --notes-file docs/preview/RELEASE-NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "Abralo $GITHUB_REF_NAME" --draft --notes-file docs/preview/RELEASE-NOTES.md
          fi
