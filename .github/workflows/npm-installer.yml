name: Verify npm installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'installer/**'
      - 'scripts/npm-installer-check.mjs'
      - 'scripts/installer-acceptance-smoke.mjs'
      - '.github/workflows/npm-installer.yml'

permissions:
  contents: read

jobs:
  install:
    name: npm installer / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Check refusal paths and platform commands
        run: node --experimental-vm-modules scripts/npm-installer-check.mjs
      - name: Pack and inspect exact npm payload
        run: |
          npm pack ./installer --pack-destination .
          tar -xzf abralo-0.1.3-preview.tgz
          npm exec --yes --package=./abralo-0.1.3-preview.tgz -- abralo --version
      - name: Verify pnpm invocation
        working-directory: ${{ runner.temp }}
        run: |
          npm install --global pnpm@10.33.4
          pnpm --package="${{ github.workspace }}/abralo-0.1.3-preview.tgz" dlx abralo --help
      - name: Create target manifest for disposable-profile acceptance
        run: node --input-type=module -e "import {mkdirSync,writeFileSync} from 'node:fs'; mkdirSync('installer-target'); writeFileSync('installer-target/release.json',JSON.stringify({platform:process.platform,arch:process.arch}));"
      - name: Download, verify, install and remove through packed npm entry
        run: node scripts/installer-acceptance-smoke.mjs installer-target package/bin/abralo.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-installer-${{ matrix.runner }}
          path: abralo-0.1.3-preview.tgz
