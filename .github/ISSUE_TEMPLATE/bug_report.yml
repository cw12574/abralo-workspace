name: Bug report
description: Report a reproducible problem with installation, onboarding or a task.
body:
  - type: markdown
    attributes:
      value: |
        This is a public issue. Do not include credentials, sign-in codes, account identifiers, private prompts, workspace databases or unreviewed logs.
        For suspected vulnerabilities, follow [SECURITY.md](https://github.com/cw12574/abralo-workspace/blob/main/SECURITY.md) instead.
  - type: input
    id: version
    attributes:
      label: Abralo version or commit
      placeholder: v0.1.3-preview, or the commit if building from source
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, CPU and browser
      description: Include OS/browser versions and Linux distribution if applicable.
      placeholder: macOS version, Apple silicon, Safari version
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did the problem happen?
      options:
        - Download or installation
        - App startup
        - Provider sign-in or connection check
        - First task
        - Later task or agent handoff
        - Restart or recovery
        - Something else
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider involved
      options:
        - Not applicable
        - Codex
        - Claude
        - OpenCode
        - More than one
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use disposable example files. Mention whether this was a fresh install or an upgrade and the last step that worked.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include the exact visible error and whether it happens again. Note unexpected file changes or activity after Stop.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional redacted evidence
      description: Only the relevant screenshot or short service.log excerpt. Review it before attaching; never upload a full log or workspace backup.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked that this report contains no credentials, sign-in codes, private conversations or other sensitive data.
          required: true
